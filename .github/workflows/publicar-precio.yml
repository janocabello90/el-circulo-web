# Publica el precio de El Círculo el 17 de noviembre a las 6:00 (hora de Madrid).
# Fusiona la rama precio-17nov en main; Vercel despliega solo.
# Hay dos horas por si GitHub retrasa o se salta la primera; la segunda no hace nada si ya está publicado.
name: Publicar precio (17 nov, 6:00)

on:
  schedule:
    - cron: "0 5 17 11 *"   # 06:00 Madrid (UTC+1)
    - cron: "20 5 17 11 *"  # reintento 06:20
  workflow_dispatch:

permissions:
  contents: write

concurrency: publicar-precio

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fusionar precio-17nov en main
        run: |
          if ! git ls-remote --exit-code --heads origin precio-17nov >/dev/null; then
            echo "La rama precio-17nov ya no existe. Nada que hacer."; exit 0
          fi
          git fetch origin precio-17nov
          if git merge-base --is-ancestor origin/precio-17nov HEAD; then
            echo "El precio ya está publicado. Nada que hacer."; exit 0
          fi
          git config user.name "Jano Cabello"
          git config user.email "janocabellom@gmail.com"
          git merge --no-edit origin/precio-17nov
          git push origin HEAD:main
